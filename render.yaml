services:
  - type: web
    name: hostle-management-system
    env: node
    plan: free
    buildCommand: cd hostel-management-system && npm install && npm run build && cd backend && npm install
    startCommand: cd hostel-management-system/backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSKEY
        value: "484951"
      - key: FACULTY_SIGNUP_KEY
        value: "484955"

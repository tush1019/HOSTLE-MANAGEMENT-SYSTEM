services:
  - type: web
    name: hostle-management-system
    env: node
    plan: free
    buildCommand: cd hostel-management-system && npm install --include=dev && npm run build && cd backend && npm install
    startCommand: cd hostel-management-system/backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES
        value: "8h"
      - key: ADMIN_PASSKEY
        sync: false
      - key: FACULTY_SIGNUP_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: FRONTEND_URL
        sync: false
